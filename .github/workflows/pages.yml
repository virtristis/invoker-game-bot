name: Website

# Publishes site/ (plus the images from docs/) to GitHub Pages.
on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site/img
          cp site/* _site/
          cp docs/banner.png docs/practice.png docs/stats.png docs/social-preview.png _site/img/
          cp assets/icon.ico _site/img/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
